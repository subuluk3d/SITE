<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Impressão 3D | Subuluk 3D</title>
<meta name="description" content="Catálogo da Subuluk 3D: placas NFC, chaveiros, brindes, decoração, organizadores, peças de reposição e muito mais, impressos em 3D em Caraguatatuba. Busque e peça pelo WhatsApp.">
<link rel="canonical" href="https://subuluk3d.github.io/SITE/catalogo.html">
<meta name="theme-color" content="#060706">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Subuluk 3D">
<meta property="og:title" content="Catálogo | Subuluk 3D">
<meta property="og:description" content="Busque peças impressas em 3D por categoria e peça seu orçamento pelo WhatsApp.">
<meta property="og:url" content="https://subuluk3d.github.io/SITE/catalogo.html">
<meta property="og:image" content="https://subuluk3d.github.io/SITE/assets/og-image.jpg">

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
<style>
:root{--bg:#060706;--bg2:#0B0D0B;--panel:#111411;--panel2:#171B17;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
--ink:#EEF2EC;--mute:#97A094;--lime:#B8FF3C;--on-lime:#081006;--green:#4CD62B;--r:16px;
--display:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:140px}
body{font-family:var(--display);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--lime);color:var(--on-lime);padding:8px 12px;border-radius:8px}
.mono{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.wrap{width:min(1440px,100% - 32px);margin:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none}

/* ===== topo ===== */
.top{position:sticky;top:0;z-index:50;background:rgba(6,7,6,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:hover{background:var(--panel2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.12em;font-size:.9rem;flex:none}
.brand img{width:30px;height:30px}.brand b{color:var(--lime)}
.search{position:relative;flex:1;max-width:680px;margin-inline:auto}
.search form{display:flex;align-items:center;height:44px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:0 6px 0 16px;transition:border-color .15s,box-shadow .15s}
.search form:focus-within{border-color:var(--lime);box-shadow:0 0 0 3px rgba(184,255,60,.15)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;padding:0 10px;font-size:.96rem}
.search input::placeholder{color:#7D867A}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{font-family:var(--mono);font-size:.7rem;border:1px solid var(--line2);border-radius:6px;padding:2px 7px;color:var(--mute)}
.search .clr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.search .clr:hover{background:var(--panel)}
.search .clr[hidden]{display:none}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:70vh;overflow:auto}
.sugg[hidden]{display:none}
.sugg .h{padding:8px 10px 4px}
.opt{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:var(--panel2)}
.opt img,.opt .ci{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#1d211d;display:grid;place-items:center;color:var(--lime)}
.opt .ci svg{width:20px;height:20px}
.opt strong{font-weight:500;font-size:.94rem}.opt mark{background:none;color:var(--lime)}
.opt small{display:block;color:var(--mute);font-size:.8rem}
.opt.all{color:var(--lime);font-weight:500}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:var(--lime);color:var(--on-lime);font-weight:700;font-size:.9rem;flex:none;transition:box-shadow .2s}
.cta:hover{box-shadow:0 0 0 5px rgba(184,255,60,.15)}

/* faixa de categorias */
.cats{position:relative;border-top:1px solid var(--line)}
.cats .wrap{display:flex;align-items:center;gap:6px;height:56px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;flex:1;padding:2px}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.88rem;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.pill svg{width:16px;height:16px;color:var(--lime)}
.pill:hover{border-color:var(--line2);background:#1d221d}
.pill[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill[aria-current="true"] svg{color:var(--bg)}
.arr{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.arr[disabled]{opacity:.25;cursor:default}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60}
.scrim[hidden],.drawer[hidden]{display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:61;background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:14px 12px 30px;animation:dr .22s ease-out}
@keyframes dr{from{transform:translateX(-100%)}}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 12px}
.drawer h2{font-size:.72rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 10px 8px;font-weight:500}
.dl{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:10px;font-size:.94rem;color:#D3DAD0}
.dl:hover,.dl[aria-current="true"]{background:var(--panel2);color:#fff}
.dl svg{width:18px;height:18px;color:var(--lime);flex:none}
.dl span.c{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--mute);white-space:nowrap}

/* ===== conteúdo ===== */
main{padding:22px 0 80px;min-height:60vh;outline:none}
.sec{margin-top:40px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:16px}
.sh h2{font-size:1.4rem;letter-spacing:-.02em}
.sh a{color:var(--lime);font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}

/* banners */
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.slides{display:flex;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;display:grid;grid-template-columns:1.1fr .9fr;min-height:clamp(260px,30vw,360px);position:relative}
.slide .tx{padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;justify-content:center;gap:14px;z-index:1}
.slide h2{font-size:clamp(1.8rem,3.6vw,3.2rem);line-height:1;letter-spacing:-.035em;font-weight:700}
.slide h2 em{font-style:normal;color:var(--lime)}
.slide p{color:#BFC8BC;max-width:44ch}
.slide .ph{position:relative;overflow:hidden}
.slide .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .ph::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--panel),transparent 40%)}
.slide.s1{background:radial-gradient(80% 120% at 0% 100%,rgba(76,214,43,.25),transparent 60%),var(--panel)}
.slide.s2{background:radial-gradient(80% 120% at 0% 0%,rgba(184,255,60,.18),transparent 60%),var(--panel)}
.slide.s3{background:radial-gradient(80% 120% at 0% 100%,rgba(60,170,255,.16),transparent 60%),var(--panel)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--lime);color:var(--on-lime);font-weight:700;width:max-content}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.hctl{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;align-items:center;z-index:2}
.dots{display:flex;gap:6px;margin-right:6px}
.dots button{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.3);transition:width .3s,background .3s;padding:0}
.dots button[aria-current="true"]{width:24px;background:var(--lime)}
.hctl .arr{background:rgba(6,7,6,.7)}

/* tiles de categoria */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,transform .25s}
.tile:hover{border-color:rgba(184,255,60,.5);transform:translateY(-3px)}
.tile .im{aspect-ratio:4/3;background:radial-gradient(70% 70% at 50% 40%,rgba(184,255,60,.08),transparent),var(--panel2);display:grid;place-items:center;overflow:hidden;position:relative}
.tile .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tile:hover .im img{transform:scale(1.06)}
.tile .im>svg{width:42px;height:42px;color:var(--lime);opacity:.85}
.tile .im .so{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(6,7,6,.8);border:1px solid var(--line2);padding:3px 7px;border-radius:999px;color:#cfd6cc}
.tile .tt{padding:10px 12px 12px}
.tile strong{display:block;font-weight:500;font-size:.92rem;line-height:1.25}
.tile small{font-family:var(--mono);font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

/* linha rolável */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#333 transparent;padding-bottom:8px}
@media(min-width:1200px){.row{grid-auto-columns:calc((100% - 14px*5)/6)}}

/* grade de produtos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .25s,box-shadow .25s;text-align:left}
.card:hover{border-color:rgba(184,255,60,.45);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.card .im{position:relative;aspect-ratio:1;background:#1a1d1a;overflow:hidden}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s,transform .5s}
.card .im img+img{opacity:0}
.card:hover .im img+img{opacity:1}.card:hover .im img{transform:scale(1.03)}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.bd{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;font-weight:700;background:var(--lime);color:var(--on-lime)}
.bd.o{background:rgba(6,7,6,.82);color:#E3E9E0;border:1px solid var(--line2);font-weight:500}
.card .bo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:.98rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 mark{background:rgba(184,255,60,.22);color:inherit;border-radius:3px}
.card .ct{font-size:.8rem;color:var(--mute)}
.card .ft{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .wa{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.card .wa svg{width:16px;height:16px}
.card:hover .wa{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}

/* lista */
.crumb{font-size:.86rem;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb a:hover{color:var(--lime)}
.lh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin:14px 0 18px}
.lh h1{font-size:clamp(1.7rem,3.4vw,2.6rem);letter-spacing:-.03em;line-height:1.05}
.lh p{color:var(--mute);max-width:60ch;margin-top:6px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-block:1px solid var(--line);margin-bottom:20px}
.tools .subs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:.84rem;background:transparent}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);border-color:var(--lime);font-weight:700}
.sel{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);padding:0 34px 0 12px;font-size:.88rem;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--lime) 50%),linear-gradient(135deg,var(--lime) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.tg{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;cursor:pointer;min-height:38px}
.tg input{width:18px;height:18px;accent-color:var(--lime)}
.count{font-family:var(--mono);font-size:.74rem;color:var(--mute);margin-left:auto}
.empty{border:1px dashed var(--line2);border-radius:20px;padding:clamp(28px,5vw,56px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg2)}
.empty>svg{width:48px;height:48px;color:var(--lime)}
.empty h2{font-size:1.4rem}.empty p{color:var(--mute);max-width:52ch}
.empty ul{list-style:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty li{font-size:.84rem;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;color:#D3DAD0}

/* modal do produto */
.pm{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.pm[hidden]{display:none}
.pbox{position:relative;width:min(1040px,100%);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:22px;display:grid;grid-template-columns:1.1fr .9fr}
.pbox .x{position:absolute;top:12px;right:12px;z-index:2;background:rgba(6,7,6,.8);border:1px solid var(--line2)}
.gal{padding:14px;display:flex;flex-direction:column;gap:10px}
.gal .main{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#1a1d1a}
.gal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px}
.thumbs button{width:72px;height:72px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;opacity:.6}
.thumbs button[aria-current="true"]{border-color:var(--lime);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pin{padding:clamp(20px,3vw,34px);display:flex;flex-direction:column;gap:14px}
.pin h2{font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.025em;line-height:1.1}
.pin p.d{color:#C3CBC0}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.9rem;border-block:1px solid var(--line);padding:14px 0}
.specs dt{color:var(--mute)}.specs dd{color:var(--ink)}
.pin .acts{display:flex;gap:10px;flex-wrap:wrap}
.pin .note{font-size:.8rem;color:var(--mute)}
.rel{grid-column:1/-1;padding:0 18px 20px}
.rel .row{grid-auto-columns:minmax(170px,200px)}
.rel .card h3{font-size:.88rem}

footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:16px;flex-wrap:wrap}footer a:hover,footer button:hover{color:var(--lime)}
footer button{color:inherit;font-size:inherit}

@media(max-width:860px){
  .bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .search{order:3;flex:1 0 100%;max-width:none}
  .brand{margin-right:auto}
  .cta .t{display:none}.cta{width:44px;padding:0;justify-content:center}
  .search kbd{display:none}
  .slide{grid-template-columns:1fr;min-height:0}.slide .ph{height:180px;order:-1}
  .slide .ph::before{background:linear-gradient(0deg,var(--panel),transparent 60%)}
  .slide .tx{padding-bottom:70px}
  .pbox{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card .bo{padding:10px 11px 12px}.card h3{font-size:.9rem}
  .tiles{grid-template-columns:repeat(3,1fr);gap:8px}
  .row{grid-auto-columns:46%}
  html{scroll-padding-top:190px}
}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.arr.side{display:none}.card .ft .mono{font-size:.62rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.strip{scroll-behavior:auto}}
</style>
</head>

<symbol id="i-r" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></symbol>

  else if(s.pers){title="Personalizáveis";desc="Peças que aceitam nome, texto, logotipo ou cores sob medida."}
  else if(s.o==="recentes"){title="Novidades";desc="As peças mais recentes do catálogo."}
  else{title="Todas as peças";desc=""}
  var subs=n&&n.subs&&n.subs.length&&cnt(n.id)?n.subs.filter(function(x){return P.some(function(p){return p.nicho===n.id&&p.sub===x})}):[];
  var h='<nav class="crumb" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">/</span><a href="catalogo.html">Catálogo</a>'+(n?'<span aria-hidden="true">/</span><span aria-current="page">'+E(n.nome)+'</span>':"")+'</nav>'+
    '<div class="lh"><div><h1>'+title+'</h1>'+(desc?'<p>'+E(desc)+'</p>':"")+'</div></div>';
  if(!(n&&!cnt(n.id)))h+='<div class="tools" role="group" aria-label="Filtros">'+
      '<div class="subs">'+(subs.length>1?['<button class="chip" type="button" data-sub="" aria-pressed="'+!s.s+'">Todas</button>'].concat(subs.map(function(x){return'<button class="chip" type="button" data-sub="'+E(x)+'" aria-pressed="'+(s.s===x)+'">'+E(x)+'</button>'})).join(""):"")+'</div>'+
      '<label class="tg"><input type="checkbox" id="fpers"'+(s.pers?" checked":"")+'>Só personalizáveis</label>'+
      '<label class="sr" for="ford">Ordenar</label><select class="sel" id="ford"><option value="">'+(s.q?"Relevância":"Ordenar")+'</option><option value="recentes"'+(s.o==="recentes"?" selected":"")+'>Mais recentes</option><option value="destaque"'+(s.o==="destaque"?" selected":"")+'>Mais pedidos</option><option value="nome"'+(s.o==="nome"?" selected":"")+'>Nome (A–Z)</option></select>'+
      '<span class="count" role="status">'+L.length+(L.length===1?" peça":" peças")+'</span></div>';
  if(L.length)h+='<div class="grid">'+L.map(function(p){return card(p,s.q)}).join("")+'</div>';
  else if(n&&!cnt(n.id)){h+='<div class="empty">'+ic(n.id)+'<h2>Feito sob encomenda</h2><p>Ainda não temos fotos desta categoria no catálogo, mas fazemos sob medida. Conte o que você precisa e mandamos o orçamento.</p>'+(n.subs&&n.subs.length?'<ul>'+n.subs.map(function(x){return"<li>"+E(x)+"</li>"}).join("")+'</ul>':"")+'<a class="btn" target="_blank" rel="noopener" href="'+wa("Olá! Vi a categoria "+n.nome+" no catálogo da Subuluk 3D e quero um orçamento.")+'"><svg class="i" style="width:18px;height:18px"><use href="#i-wa"/></svg>Pedir orçamento</a></div>'}
  else h+='<div class="empty"><svg aria-hidden="true"><use href="#i-search"/></svg><h2>Nada encontrado'+(s.q?' para “'+E(s.q)+'”':"")+'</h2><p>Tente outra palavra ou veja todas as categorias. Se não estiver no catálogo, a gente faz sob medida.</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn gh" href="catalogo.html">Ver todo o catálogo</a><a class="btn" target="_blank" rel="noopener" href="'+wa("Olá! Procurei "+(s.q||"uma peça")+" no catálogo da Subuluk 3D e não encontrei. Vocês fazem?")+'">Pedir sob medida</a></div></div>';
  main.innerHTML=h;
  $$("[data-sub]").forEach(function(b){b.onclick=function(){var t=getS();t.s=b.getAttribute("data-sub");go(t)}});
  if($("#fpers"))$("#fpers").onchange=function(){var t=getS();t.pers=this.checked;go(t)};
  if($("#ford"))$("#ford").onchange=function(){var t=getS();t.o=this.value;go(t)};
  if(s.q)track("search",{search_term:s.q,results:L.length});
  if(n)track("view_item_list",{item_list_id:n.id,item_list_name:n.nome});
}

/* ---------- modal do produto ---------- */
var lastFocus=null;
function openProduct(ref){
  var p=P.filter(function(x){return x.ref===ref})[0],pm=$("#pm");if(!p)return;
  var n=byId[p.nicho]||{},f=p.fotos||[],rel=P.filter(function(x){return x.nicho===p.nicho&&x.ref!==p.ref}).slice(0,8);
  var msg="Olá! Vi no catálogo a peça "+p.nome+" ("+p.ref+") e quero um orçamento.";
  pm.innerHTML='<div class="pbox"><button class="ib x" type="button" data-close aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button>'+
    '<div class="gal"><div class="main">'+(f[0]?'<img id="pmImg" src="'+E(f[0])+'" alt="'+E(p.nome)+'">':"")+'</div>'+
    (f.length>1?'<div class="thumbs">'+f.map(function(src,i){return'<button type="button" data-img="'+E(src)+'" aria-label="Foto '+(i+1)+'" aria-current="'+(i===0)+'"><img src="'+E(src)+'" alt=""></button>'}).join("")+'</div>':"")+'</div>'+
    '<div class="pin"><nav class="crumb" aria-label="Categoria"><a href="'+url({n:p.nicho})+'">'+E(n.nome||"")+'</a>'+(p.sub?'<span aria-hidden="true">/</span><span>'+E(p.sub)+'</span>':"")+'</nav>'+
    '<h2 id="pm-t">'+E(p.nome)+'</h2><div class="badges" style="position:static">'+(p.destaque?'<span class="bd">Mais pedido</span>':"")+(p.personalizavel?'<span class="bd o">Personalizável</span>':"")+'</div>'+
    '<p class="d">'+E(p.descricao)+'</p>'+
    '<dl class="specs"><dt>Código</dt><dd>'+E(p.ref)+'</dd>'+(p.dimensoes?'<dt>Medidas</dt><dd>'+E(p.dimensoes)+'</dd>':"")+((p.cores||[]).length?'<dt>Cores</dt><dd>'+E(p.cores.join(", "))+'</dd>':"")+'<dt>Personalização</dt><dd>'+(p.personalizavel?"Sim: nome, texto, logo ou cores":"Modelo padrão")+'</dd></dl>'+
    '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="'+wa(msg)+'"><svg class="i" style="width:18px;height:18px"><use href="#i-wa"/></svg>Pedir pelo WhatsApp</a><button class="btn gh" type="button" id="copy"><svg class="i" style="width:16px;height:16px"><use href="#i-link"/></svg><span>Copiar link</span></button></div>'+
    '<p class="note">Imagens ilustrativas. Cores e acabamento podem variar na peça real. Preço e prazo vêm no orçamento.</p></div>'+
    (rel.length?'<div class="rel"><div class="sh"><h2 style="font-size:1.1rem">Mais em '+E(n.nome||"")+'</h2></div><div class="row">'+rel.map(function(x){return card(x)}).join("")+'</div></div>':"")+'</div>';
  if(pm.hidden)lastFocus=document.activeElement;
  pm.hidden=false;document.documentElement.classList.add("ck-lock");$(".pbox",pm).scrollTop=0;
  $("[data-close]",pm).focus();
  document.title=p.nome+" | Subuluk 3D";
  $$("[data-img]",pm).forEach(function(b){b.onclick=function(){$("#pmImg").src=b.getAttribute("data-img");$$("[data-img]",pm).forEach(function(x){x.setAttribute("aria-current",x===b)})}});
  $("#copy").onclick=function(){var l=location.href,sp=$("span",this);(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(function(){sp.textContent="Link copiado"},function(){prompt("Copie o link:",l)})};
  track("view_item",{items:[{item_id:p.ref,item_name:p.nome,item_category:n.nome}]});
}
function closeProduct(){var pm=$("#pm");if(pm.hidden)return;pm.hidden=true;pm.innerHTML="";document.documentElement.classList.remove("ck-lock");if(lastFocus&&lastFocus.offsetParent)lastFocus.focus()}
$("#pm").addEventListener("click",function(e){if(e.target===this||e.target.closest("[data-close]")){var s=getS();s.p="";go(s)}});
document.addEventListener("keydown",function(e){
  var pm=$("#pm");
  if(!pm.hidden){
    if(e.key==="Escape"){var s=getS();s.p="";go(s)}
    if(e.key==="Tab"){var f=$$("a[href],button:not([disabled])",pm),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    return;
  }
  if(e.key==="/"&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}
});

/* ---------- navegação interna (sem recarregar) ---------- */
document.addEventListener("click",function(e){
  var a=e.target.closest("a[href]");if(!a||e.defaultPrevented||e.ctrlKey||e.metaKey||e.shiftKey||a.target==="_blank")return;
  var h=a.getAttribute("href");if(h.indexOf("catalogo.html")!==0)return;
  e.preventDefault();var ref=a.getAttribute("data-ref");
  if(ref){var s=getS();s.p=ref;track("select_item",{items:[{item_id:ref}]});history.pushState(null,"",url(s));openProduct(ref);return}
  closeDrawer(true);history.pushState(null,"",h);render();main.focus({preventScroll:true});scrollTo({top:0});
});
addEventListener("popstate",render);

/* ---------- busca com sugestões (combobox acessível) ---------- */
var q=$("#q"),sg=$("#sugg"),opts=[],act=-1;
function closeSug(){sg.hidden=true;q.setAttribute("aria-expanded","false");q.removeAttribute("aria-activedescendant");act=-1}
function suggest(){
  var v=q.value.trim();$("#clr").hidden=!v;
  if(!v){closeSug();return}
  var cats=N.filter(function(n){return norm(n.nome).indexOf(norm(v))>=0||(n.subs||[]).some(function(x){return norm(x).indexOf(norm(v))>=0})}).slice(0,3);
  var prods=filter({q:v}).slice(0,6),h="",i=0;
  if(cats.length)h+='<div class="h mono" aria-hidden="true">Categorias</div>'+cats.map(function(n){var c=cnt(n.id);return'<div class="opt" role="option" id="o'+(i++)+'" data-go="'+E(url({n:n.id}))+'"><span class="ci">'+ic(n.id)+'</span><div><strong>'+hl(n.nome,v)+'</strong><small>'+(c?c+" peças":"Sob encomenda")+'</small></div></div>'}).join("");
  if(prods.length)h+='<div class="h mono" aria-hidden="true">Peças</div>'+prods.map(function(p){return'<div class="opt" role="option" id="o'+(i++)+'" data-ref="'+E(p.ref)+'">'+((p.fotos||[])[0]?'<img src="'+E(p.fotos[0])+'" alt="">':'<span class="ci">'+ic(p.nicho)+'</span>')+'<div><strong>'+hl(p.nome,v)+'</strong><small>'+E((byId[p.nicho]||{}).nome||"")+' · '+E(p.ref)+'</small></div></div>'}).join("");
  h+='<div class="opt all" role="option" id="o'+(i++)+'" data-go="'+E(url({q:v}))+'"><span class="ci"><svg class="i"><use href="#i-search"/></svg></span>Ver todos os resultados para “'+E(v)+'”</div>';
  sg.innerHTML=h;opts=$$(".opt",sg);act=-1;sg.hidden=false;q.setAttribute("aria-expanded","true");
}
function pick(o){closeSug();q.blur();if(o.dataset.ref){var s=getS();s.p=o.dataset.ref;history.pushState(null,"",url(s));openProduct(o.dataset.ref)}else{history.pushState(null,"",o.dataset.go);render();scrollTo({top:0})}}
q.addEventListener("input",suggest);
q.addEventListener("focus",function(){if(q.value)suggest()});
q.addEventListener("keydown",function(e){
  if(e.key==="ArrowDown"&&sg.hidden){suggest();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!opts.length)return;act=(act+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;
    opts.forEach(function(o,j){o.setAttribute("aria-selected",j===act)});q.setAttribute("aria-activedescendant",opts[act].id);opts[act].scrollIntoView({block:"nearest"})}
  else if(e.key==="Escape"){e.stopPropagation();if(!sg.hidden)closeSug();else{q.value="";$("#clr").hidden=true}}
  else if(e.key==="Enter"&&act>=0){e.preventDefault();pick(opts[act])}
});
sg.addEventListener("mousedown",function(e){var o=e.target.closest(".opt");if(o){e.preventDefault();pick(o)}});
document.addEventListener("click",function(e){if(!e.target.closest(".search"))closeSug()});
$("#sform").addEventListener("submit",function(e){e.preventDefault();var v=q.value.trim();closeSug();q.blur();go(v?{q:v}:{});scrollTo({top:0})});
$("#clr").onclick=function(){q.value="";$("#clr").hidden=true;closeSug();q.focus();var s=getS();if(s.q){s.q="";go(s)}};

/* ---------- faixa e gaveta ---------- */
$("#strip").addEventListener("scroll",arrows,{passive:true});addEventListener("resize",arrows);
$("#stripL").onclick=function(){$("#strip").scrollBy({left:-$("#strip").clientWidth*.7})};
$("#stripR").onclick=function(){$("#strip").scrollBy({left:$("#strip").clientWidth*.7})};
var dr=$("#drawer"),scrim=$("#scrim"),ob=$("#openDrawer");
function openDrawer(){dr.hidden=false;scrim.hidden=false;ob.setAttribute("aria-expanded","true");document.documentElement.classList.add("ck-lock");$("#closeDrawer").focus()}
function closeDrawer(silent){if(dr.hidden)return;dr.hidden=true;scrim.hidden=true;ob.setAttribute("aria-expanded","false");document.documentElement.classList.remove("ck-lock");if(!silent)ob.focus()}
ob.onclick=openDrawer;$("#closeDrawer").onclick=function(){closeDrawer()};scrim.onclick=function(){closeDrawer()};
dr.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer();if(e.key==="Tab"){var f=$$("a,button",dr),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ---------- render ---------- */
function render(){
  if(!D)return;var s=getS();
  q.value=s.q;$("#clr").hidden=!s.q;
  strip(s);
  var key=JSON.stringify([s.q,s.n,s.s,s.f,s.o,s.pers]);
  if(main.dataset.key!==key){main.dataset.key=key;(s.q||s.n||s.f||s.o||s.pers)?viewList(s):viewHome()}
  if(s.p)openProduct(s.p);else{closeProduct();var n=byId[s.n];document.title=n?n.nome+" | Catálogo Subuluk 3D":s.q?"Busca: "+s.q+" | Subuluk 3D":"Catálogo de Impressão 3D | Subuluk 3D"}
}
$$("[data-wa]").forEach(function(a){a.href=wa();a.target="_blank";a.rel="noopener"});
fetch("produtos.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  D=d;N=d.nichos||[];P=d.produtos||[];N.forEach(function(n){byId[n.id]=n});
  $$("[data-wa]").forEach(function(a){a.href=wa()});
  var ld=document.createElement("script");ld.type="application/ld+json";
  ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"ItemList","name":"Catálogo Subuluk 3D","itemListElement":P.map(function(p,i){return{"@type":"ListItem","position":i+1,"url":"https://subuluk3d.github.io/SITE/catalogo.html?p="+encodeURIComponent(p.ref),"name":p.nome}})});
  document.head.appendChild(ld);
  render();
}).catch(function(){main.innerHTML='<div class="empty"><h2>Não foi possível carregar o catálogo</h2><p>Atualize a página. Se o problema continuar, fale com a gente pelo WhatsApp.</p><a class="btn" href="'+wa()+'" target="_blank" rel="noopener">Chamar no WhatsApp</a></div>'});
})();
</script>
</body>
